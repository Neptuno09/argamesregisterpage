<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argames | Registro de Evento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="stylesmodcolor.css">
</head>
<body>
    <div class="bg-container">
        <div class="bg-pixel-overlay"></div>
        <div class="particles" id="particles"></div>
    </div>

    <header>
        <div class="logo-container">
            <h1>ARGAMES</h1>
            <div class="subtitle">Evento de Minecraft</div>
        </div>

        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 0;gap:4px;">
  <h1 class="spaces-count" style="font-size:96px;font-weight:700;line-height:1;margin:0;letter-spacing:-4px;"></h1>
<p style="font-size:13px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:#888;">espacios disponibles</p>
</div>
        
        <div class="info-pills">
            <div class="pill">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                Próximamente
            </div>
        </div>
    </header>

    <main class="form-wrapper">
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>

        <div class="glass-panel">
            <div class="panel-header">
                <div class="panel-title">Formulario de Registro</div>
                <div class="dots">
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>
            <div class="iframe-container">
                <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSe3UPYqiBbOSamcIAPaj-k4FyDRhBw3ngP4Cfz0RzcE3hAoDA/viewform?embedded=true">Cargando…</iframe>
            </div>
        </div>
    </main>

    <footer>
        <div class="branding">Creado por Beneck y Fluff. Página hecha por Nep</div>
    </footer>

    <script>
                // --- CONFIGURACIÓN DE GOOGLE SHEETS ---
        // Reemplaza esta URL con el enlace CSV que copiaste al "Publicar en la Web"
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTlnJrVWLWcE6H1_8G58JiWrjBdN2MERmwNv7zCWFelcIN--NFU_XZdG6k0BN5xEyTzbomi49bHO6in/pub?gid=80156682&single=true&output=csv';

                // ⚙️ AJUSTÁ ESTOS DOS VALORES según dónde está el número en tu hoja:
        const TARGET_ROW = 8;    // Fila (empieza en 0). Fila 6 de la hoja = índice 5
        const TARGET_COL = 0;    // Columna (empieza en 0). Columna F = índice 5
 
        // Parsea una línea CSV respetando comillas (ej: "50,00" no se rompe)
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const ch = line[i];
                if (ch === '"') {
                    inQuotes = !inQuotes;
                } else if (ch === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += ch;
                }
            }
            result.push(current.trim());
            return result;
        }
 
        async function updateSpaces() {
            const countElement = document.getElementById('spaces-count');
            try {
                const response = await fetch(SHEET_CSV_URL + '&t=' + Date.now()); // evita caché
                const data = await response.text();
 
                const rows = data.split('\n');
                console.log(`[Argames] CSV cargado. Filas encontradas: ${rows.length}`);
 
                if (rows.length <= TARGET_ROW) {
                    console.warn(`[Argames] La fila ${TARGET_ROW} no existe. Revisá TARGET_ROW.`);
                    return;
                }
 
                const cols = parseCSVLine(rows[TARGET_ROW]);
                console.log(`[Argames] Fila ${TARGET_ROW}:`, cols);
 
                if (cols.length <= TARGET_COL) {
                    console.warn(`[Argames] La columna ${TARGET_COL} no existe en esa fila. Revisá TARGET_COL.`);
                    return;
                }
 
                const value = cols[TARGET_COL].replace(/[^0-9]/g, ''); // solo números
                console.log(`[Argames] Valor leído en [${TARGET_ROW}][${TARGET_COL}]: "${value}"`);
 
                if (value !== '') {
                    document.querySelectorAll('.spaces-count').forEach(el => el.innerText = value);
                } else {
                    console.warn('[Argames] El valor está vacío o no es un número.');
                }
            } catch (error) {
                console.error('[Argames] Error cargando espacios:', error);
            }
        }
 
        updateSpaces();
        setInterval(updateSpaces, 30000);

        // Create floating particles
        const particlesContainer = document.getElementById('particles');
        const particleCount = 20;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            
            // Randomize position and timing
            const left = Math.random() * 100;
            const delay = Math.random() * 10;
            const duration = 5 + Math.random() * 10;
            const size = 2 + Math.random() * 4;

            particle.style.left = left + '%';
            particle.style.animationDelay = delay + 's';
            particle.style.animationDuration = duration + 's';
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';

            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>
